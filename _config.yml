# Site settings
title: JailbreakRadar
email: junjie.chu@cispa.de
description: >
  Website for "JailbreakRadar: Comprehensive Assessment of Jailbreak Attacks Against LLMs."
lang: en-US

baseurl: "/jailbreakradar.github.io" # the subpath of your site, e.g. /blog/
url: https://junjie-chu.github.io # the base hostname & protocol for your site
# theme options from https://bootswatch.com/3/
# comment out this to use default Bootstrap
bootwatch: paper # cerulean cosmo custom cyborg darkly flatly journal lumen readable sandstone simplex slate solar spacelab superhero united yeti

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - .idea/
  - .gitignore
  - README.md
  - LICENSE
  - Dockerfile
  - nginx.conf
  - vendor
  - .DS_Store
timezone: Europe/Berlin
